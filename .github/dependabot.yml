# 의존성 노후 방지 (libs.versions.toml 및 GitHub Actions 버전 갱신 PR 자동 생성)
#
# 주의: 여기서 설정하는 것은 "버전 업데이트"(노후 방지)다. 보안 취약점 대응인
# "Dependabot 보안 업데이트"는 별개 기능이며 리포 Settings 에서 켠다 — 이 파일과
# 무관하게, 아래 스케줄과도 무관하게 동작한다.
#
# 주간 스캔은 실익 없는 minor/patch 범프가 매주 쏟아져 잡무만 늘었다(2026-07 경험:
# 이틀간 PR 14건, 그중 앱 동작에 영향 있는 것은 play-services-ads 하나뿐).
# → 월간으로 낮추고 동시 PR 수도 줄여 배치를 작게 유지한다.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # app/build.gradle.kts 의 constraints 블록에 있는 수동 핀.
      # espresso/test-core 와 앱 런타임 간 consistent resolution 충돌을 막으려고
      # 손으로 고정한 값인데, Dependabot 은 constraints 안의 버전 리터럴도
      # 일반 직접 의존성으로 보고 올린다 → 자동 범프 제외하고 수동 관리한다.
      - dependency-name: "androidx.concurrent:concurrent-futures"
      # AGP 는 Android Studio 가 지원하는 버전까지만 쓸 수 있다 (IDE 가 프로젝트를
      # 열지 못함 — 2026-08 9.3.1 범프로 실제 발생). Studio 업데이트와 함께 수동으로 올린다.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # AndroidX/Compose 계열은 상호 호환 버전을 묶어서 올린다
      androidx:
        patterns:
          - "androidx.*"
          - "com.google.dagger*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
