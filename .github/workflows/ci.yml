# PR/푸시마다 단위 테스트 + Lint + R8 릴리스 빌드를 검증한다.
#
# 시크릿 불필요:
# - local.properties 없음 → build.gradle.kts 의 prop() 기본값(PLACEHOLDER)으로 빌드
# - google-services.json 없음 → Firebase 플러그인 자동 비활성 (앱은 정상 빌드)
# - keystore.properties 없음 → assembleRelease 는 디버그 서명 폴백(경고만).
#   R8/리소스 축소 회귀를 배포 전에 잡는 것이 목적이므로 서명 종류는 무관하다.
#   (스토어 업로드용 bundleRelease 는 로컬에서 릴리스 키스토어로 수행)
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (캐시 + wrapper 검증)
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: 단위 테스트
        run: ./gradlew :app:testDebugUnitTest

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: 릴리스 빌드 (R8/리소스 축소 검증)
        run: ./gradlew :app:assembleRelease

      - name: 리포트 업로드 (테스트/린트)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # 난독화 스택트레이스 해독용. 실제 배포 릴리스의 mapping 은 로컬 빌드 산출물이지만,
      # CI 아카이브가 있으면 최소한 동일 커밋 기준 참조가 남는다.
      - name: mapping.txt 업로드
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

  # androidTest (PetMapDatabaseAssetTest 의 identity_hash 가드, Room DAO/FTS 등)를 에뮬레이터에서 실행.
  # 로컬 실기기는 스토어 설치본과의 서명 충돌로 설치가 막히는 일이 잦아, CI 가 유일한 상시 실행 지점이다.
  androidTest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (캐시)
        uses: gradle/actions/setup-gradle@v6

      # ubuntu 러너에서 하드웨어 가속(KVM) 활성화 — 없으면 에뮬레이터가 수십 분 걸리거나 타임아웃
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 테스트가 Room/파일시스템만 쓰므로 Play Services 없는 이미지(google_apis)로 충분.
      # API 34: 안정적이고 이미지가 가벼움 (minSdk 24 / targetSdk 36 사이의 중간 검증점).
      - name: 계측 테스트 (connectedDebugAndroidTest)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: androidTest 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: androidtest-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
