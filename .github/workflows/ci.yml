# PR/푸시마다 단위 테스트 + Lint + R8 릴리스 빌드를 검증한다.
#
# 시크릿 불필요:
# - local.properties 없음 → build.gradle.kts 의 prop() 기본값(PLACEHOLDER)으로 빌드
# - google-services.json 없음 → Firebase 플러그인 자동 비활성 (앱은 정상 빌드)
# - keystore.properties 없음 → assembleRelease 는 디버그 서명 폴백(경고만).
#   R8/리소스 축소 회귀를 배포 전에 잡는 것이 목적이므로 서명 종류는 무관하다.
#   (스토어 업로드용 bundleRelease 는 로컬에서 릴리스 키스토어로 수행)
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (캐시 + wrapper 검증)
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: 단위 테스트
        run: ./gradlew :app:testDebugUnitTest

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: 릴리스 빌드 (R8/리소스 축소 검증)
        run: ./gradlew :app:assembleRelease

      - name: 리포트 업로드 (테스트/린트)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # 난독화 스택트레이스 해독용. 실제 배포 릴리스의 mapping 은 로컬 빌드 산출물이지만,
      # CI 아카이브가 있으면 최소한 동일 커밋 기준 참조가 남는다.
      - name: mapping.txt 업로드
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
